# Artha Marketing (Mautic) — nginx location rules, included inside the
# Scalingo php-buildpack server{} block (root is /app, set by the buildpack).
# Mautic uses index.php at the project root as its single front controller.

# Deny direct access to application internals (config/local.php holds DB creds).
location ~* ^/(app|bin|config|vendor|var|translations|cron|build|tests)/ {
    deny all;
    return 404;
}
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# Static files served directly; everything else routed to the front controller.
location / {
    try_files $uri /index.php$is_args$args;
}

# Only the front controller may execute PHP (Symfony/Mautic best practice).
location ~ ^/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS on;
    fastcgi_read_timeout 300;
    fastcgi_pass php;
    internal;
}

# Block any other PHP entrypoint.
location ~ \.php$ {
    return 404;
}
